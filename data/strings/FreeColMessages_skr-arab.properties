model.resource.grain.description=فصل ایس زرخیز میدانی تھاں تے ٻہوں چنگی طرح پھلدی اے۔
model.resource.lumber.name=لکڑ
model.resource.lumber.description=ایس جنگل وچ لکڑ کٹݨ کیتے چنگے مضبوط درخت ہن۔
model.resource.minerals.name=معدنیات
model.resource.minerals.description=دھرتی معدنیات نال مالا مال اے، تے جیہڑے صبر کرݨ آلیاں کوں دھات یا چاندی وی لبھ سڳدی اے۔
model.resource.oasis.name=نخلستان
model.resource.oasis.description=تھل وچ نخلستان سارے تھکے ہوئے مسافراں کیتے چنگا نظارا اے۔
model.resource.ore.name=دھات
model.resource.ore.description=دھرتی پھٹ ویندی اے تے دھات دی وݙی رگ کھݨݨ کیتے دستیاب تھیندی اے۔ ایہ صرف پہاڑی تھاں تے ملدی اے۔
model.resource.silver.name=چاندی
model.resource.silver.description=ایہ پہاڑ چاندی دیاں رڳاں کیتے ٻہوں مشہور اے، تے ایندے آلے دوالے دیاں آبادیاں خوشحال تھی ویسن۔
model.resource.sugar.name=ڳنا
