model.unit.colonialRegular.name={{plural:%number%|one=نوآبادیاتی ریگولر|other=نوآبادیاتی ریگولرز|default=نوآبادیاتی ریگولر}}
model.unit.colonialRegular.description=نوآبادیاتی ریگولر ہک عمدہ یونٹ اے جیہڑا صرف اعلانِ آزادی توں بعد مِلدا اے۔
model.unit.elderStatesman.name={{plural:%number%|one=بزرگ مدبر|other=بزرگ مدبراں|default=بزرگ مدبر}}
model.unit.elderStatesman.description=بزرگ مدبر نوآبادکاراں دی آزادی دی خواہش ودھیندا اے (جیکوں آزادی دیاں گھنٹیاں ظاہر کریندیاں ہن)، جیندے نال تہاݙیاں کالونیاں وچ سنز آف لبرٹی دی رکنیت ودھدی اے۔
model.unit.expertFarmer.name={{plural:%number%|one=ماہر کسان|other=ماہر کساناں|default=ماہر کسان}}
model.unit.expertFarmer.description=ماہر کسان خوراک پیدا کرݨ وچ ماہر اے۔
model.unit.expertFisherman.name={{plural:%number%|one=ماہر مچھیرا|other=ماہر مچھیرے|default=ماہر مچھیرا}}
model.unit.expertFisherman.description=ماہر مچھیرا مچھیاں پکڑݨ وچ ماہر اے، جیہڑیاں آپݨے آپ خوراک وچ تبدیل تھی ویندیاں ہن۔
