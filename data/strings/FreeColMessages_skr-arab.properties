colopedia.concepts.education.description=<html><p>تہاݙے کالونی آلیاں کوں تعلیم ݙیوݨ دا سب توں موثر طریقہ ایہ اے جو ہک <a href="http:///id/model.building.schoolhouse">اسکول</a> بݨاؤ تے ہک ماہر یونٹ کوں استاد بݨاؤ۔ استاد ول ہک <a href="http:///id/model.unit.freeColonist">آزاد کالونی آلے</a> کوں اوہی قسم دے یونٹ وچ بدل ݙیسی۔ استاد <a href="http:///id/model.unit.pettyCriminal">چھوٹے مجرماں</a> کوں <a href="http:///id/model.unit.indenturedServant">معاہدے آلے نوکراں</a> وچ تے معاہدے آلے نوکراں کوں آزاد کالونی آلیاں وچ وی اپ گریڈ کر سڳدے ہِن۔</p><p>کجھ مہارتاں مقامی بستی وچ رہݨ بھیج کے مقامی لوکاں توں وی سکھییاں جا سڳدیاں ہِن۔ ایندے علاوہ، تہاݙیاں کالونیاں دے آس پاس دے کھیتاں تے جنگلاں وچ کم کرݨ آلے آزاد کالونی آلے تجربے دے 200 پوائنٹس تئیں جمع کریندے ہِن، جیہڑا اپ گریڈ تھیوݨ دے چار فیصد موقعے دے برابر اے۔</p></html>
colopedia.concepts.efficiency.name=کارکردگی
colopedia.concepts.efficiency.description=<html><p>تہاݙیاں کالونیاں دی کارکردگی آزادی دے خیال دی انہاں دی حمایت تے منحصر اے۔ جے 50 فیصد کالونی آلے باغی مقصد دی حمایت کرن، تاں کالونی کوں +1 پیداواری بونس ملدا اے۔ جڈاں 100 فیصد کالونی آلے باغی بݨ ونجھن، تاں پیداواری بونس ودھ کے +2 تھی ویندا اے۔</p><p>ݙوجھے پاسے، جے شاہی حمایتیاں دی تعداد <i>خراب حکومت دی حد</i> توں ودھ ونجھے، تاں کالونی کوں -1 پیداواری سزا ملدی اے۔ جے شاہی حمایتیاں دی تعداد <i>بہوں خراب حکومت دی حد</i> توں ودھ ونجھے، تاں پیداواری سزا ودھ کے -2 تھی ویندی اے۔ اے ݙوہیں حداں مشکل دی سطح تے منحصر ہِن تے انہاں کوں <a href="http:///action/difficultyAction">مشکل دی سطح دی رپورٹ</a> وچ ویکھیا ونج سڳدا اے۔</p><p>ہک کالونی دی کارکردگی ودھاوݨ کیتے، تساں کوں اوندی آبادی گھٹاوݨی پوسی، یا ودھ <a href="http:///id/model.goods.bells">آزادی دیاں گھنٹیاں</a> پیدا کرݨیاں پوسن۔</p></html>
colopedia.concepts.fortification.name=قلعہ بندی
colopedia.concepts.fortification.description=<html><p>یونٹاں ہک ٹائل تے (عارضی خندقاں تے رکاوٹاں بݨا کے) <em>قلعہ بندی</em> کر سڳدیاں ہِن تاں جو انہاں دی دفاع کرݨ دی صلاحیت ودھ ون٘جھے۔ مکمل قلعہ بندی کرݨ وچ ہک واری لڳدی اے۔ قلعہ بندی یونٹاں کوں گھات لڳاوݨ توں وی بچا ویندی اے، تے قلعہ بند توپ خانے کوں ہݨ "کھلے وچ" نئیں سمجھیا ویندا، بھانویں حملہ کرݨ نال قلعہ بندیاں کوں نقصان پہنچسی۔ قلعہ بندی صرف دفاعی جنگی بونس ݙیندی اے جڈاں ٻیاں موافق دفاعی خاصیتاں موجود نئیں ہوندیاں، ایں پاروں پہاڑاں تے یا قلعے یا قلعہ بند کالونی وچ قلعہ بندی کرݨ تے کوئی بونس نئیں ملدا۔</p></html>
colopedia.concepts.independence.name=آزادی
colopedia.concepts.independence.description=<html><p>تساں کھیل دی شروعات ہک کھوجی دے طور تے کجھ یونٹاں دے نال کریندے ہِیوے۔ بادشاہ توں توقع رکھدا اے جو تساں نویں دنیا وچ ہک کالونی قائم کرو تے خزانے تے عجیب و غریب مال اپݨے آبائی بندرگاہ تے گھن آؤ۔ تساں، بھانویں، مختلف منصوبے رکھدے ہِیوے: تساں ہک آزاد قوم قائم کرݨا چاہندے ہِیوے۔</p><p>آزادی دا اعلان کرݨ کیتے تساں کوں تہاݙیاں کالونیاں دی آبادی دے گھٹوگھٹ 50 فیصد کوں راضی کرݨا پوسی۔ تساں ایہ <a href="http:///id/model.goods.bells">آزادی دیاں گھنٹیاں</a> بݨا کے کر سڳدے ہِیوے، جیہڑیاں تہاݙیاں کالونیاں دی <a href="http:///id/colopedia.concepts.efficiency">کارکردگی</a> وی ودھا ݙیندیاں ہِن۔</p><p>جیویں تساں سوچ سڳدے ہِیوے، بادشاہ تہاکوں ایویں نئیں ون٘جݨ ݙیسی۔ آزادی دا اعلان کرݨ دے بعد، تساں کوں <a href="http:///id/colopedia.concepts.ref">شاہی مہم جوئی فوج</a> (REF) نال لڑݨا تے اونکوں تباہ کرݨا پوسی۔ جے REF کݙاہیں تہاݙیاں ساریاں ساحلی کالونیاں، یا تہاݙی آبادی دے گھٹوگھٹ 90 فیصد تے قبضہ کر گھندی اے، تاں تہاݙی آزادی دی کوشش ناکام تھی ویسی۔</p></html>
colopedia.concepts.interventionForce.name=مداخلت فوج
colopedia.concepts.interventionForce.description=<html><p>تہاݙیاں کالونیاں ولوں <a href="http:///id/colopedia.concepts.independence">آزادی</a> دا اعلان کرݨ دی کوئی وی کوشش ناگزیر طور تے تہاݙے مادر وطن کوں کمزور کریسی۔ ایہ تہاݙے مادر وطن دے دشمناں دے مفاد وچ اے۔ ایں وجہ توں، انہاں وچوں ہک تہاݙی مدد کیتے ہک <i>مداخلت فوج</i> <a href="http:///id/colopedia.concepts.ref">شاہی مہم جوئی فوج</a> دے خلاف <i>جنگ آزادی</i> وچ بھیجے گا، بشرطیکہ تساں کافی تعداد وچ <a href="http:///id/model.goods.bells">آزادی دیاں گھنٹیاں</a> پیدا کر سڳو۔</p><p>کھیل دے دوران، <i>مداخلت فوج</i> تے <a href="http:///id/colopedia.concepts.ref">شاہی مہم جوئی فوج</a> ݙوہیں کوں مزید یونٹاں نال مضبوط کیتا ویسی۔</p></html>
colopedia.concepts.ref.name=شاہی مہم جوئی فوج
colopedia.concepts.ref.description=<html><p>بادشاہ انڄݨیاں بے ترتیب فاتحاں تے مذہبی ناراضاں تے بھروسہ کرݨ توں بہتر جاݨدا اے جیہڑے ٹیکس ݙیوݨ توں یا تاج دے جائز مطالباں اڳوں جھکݨ توں انکاری ہِن۔ ایں وجہ توں بادشاہ <i>شاہی مہم جوئی فوج</i> (REF) تیار رکھدا اے تاں جو <a href="http:///id/colopedia.concepts.independence">آزادی</a> دے اعلان تے آبائی وطن توں علیحدگی دیاں کوششاں کوں دبایا ونجھے۔</p><p><i>شاہی مہم جوئی فوج</i> دی طاقت جزوی طور تے <a href="http:///id/colopedia.concepts.interventionForce">مداخلت فوج</a> نال متوازن اے، جیکوں ہک غیر ملکی طاقت تہاݙے مقصد دی ہمدردی وچ بھیجے گی، بشرطیکہ تساں کافی تعداد وچ <a href="http:///id/model.goods.bells">آزادی دیاں گھنٹیاں</a> پیدا کر سڳو۔ وقتاً فوقتاً <i>شاہی مہم جوئی فوج</i> تے <a href="http:///id/colopedia.concepts.interventionForce">مداخلت فوج</a> ݙوہاں وچ ٻیاں یونٹاں شامل کیتیاں ویسن۔</p></html>
colopedia.concepts.taxes.name=ٹیکس
colopedia.concepts.taxes.description=<html><p>کھیل دے شروع وچ بادشاہ تہاݙی آمدݨ تے کوئی ٹیکس نئیں لݨدا۔ وقت گزرݨ دے نال نال، اوہ کئی وجوہات پاروں ٹیکس ضرور ودھے گا، جیہڑیاں تساں کوں ودھ یا گھٹ قائل کر سڳدیاں ہِن۔ ہر وار جݙاں اوہ ٹیکس وچ ودھارے دی تجویز ݙیندے تے تساں انکار کریندے ہِیوے، ہک خاص قسم دے مال دا بائیکاٹ کر ݙتا ویسی، جیندا مطلب ایہ اے جو تساں ہݨ یورپ وچ انہاں کوں خرید یا ویچ نئیں سڳسو، تے تہاݙیاں کالونیاں وچ غصے آلے کالونی آلیاں ولوں سو تئیں اشیا تباہ کر ݙتیاں ویسن۔</p><p>بائیکاٹ یا تاں ٹیکس دے بقایا جات ادا کرݨ نال مُک سڳدے ہِن، جیہڑا مہنگا کم اے، یا <a href="http:///id/model.foundingFather.jacobFugger">جییکب فگر</a> دے کانٹینینٹل کانگریس وچ چݨݨ نال۔</p></html>
colopedia.foundingFather.description=<html><p>مشہور تاجر، کھوجیاں، سپاہی، سیاستدان تے مذہبی عالم، جیہڑے کانٹینینٹل کانگریس وچ چݨے ون٘جݨ تے خاص صلاحیتاں ݙیندے ہِن، انہاں کوں بانی پیو (فاؤنڈنگ فادرز) آکھیا ویندا اے۔ چݨے ون٘جݨ کیتے انہاں کوں آزادی دیاں گھنٹیاں دی ہک مقررہ تعداد پیدا کرݨی پوندی اے، جیہڑی ہر چوݨ دے بعد ودھا ݙتی ویندی اے۔ سارے بانی پیو پورے کھیل دے دوران دستیاب ہوندے ہِن، بھانویں انہاں دی نامزدگی دا امکان وقت دے نال بدلدا رہندے۔ بانی پیو ساریاں یورپی قوماں کیتے دستیاب ہِن، بھانویں انہاں کوں پہلے ہی ݙوجھی قوم نے چݨ گھدا ہووے۔</p></html>
