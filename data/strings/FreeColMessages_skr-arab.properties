model.building.armory.name=اسلحہ خانہ
model.building.armory.description=اسلحہ خانہ اوزاراں توں بندوقاں بݨاوݨ کیتے ورتیا ویندا اے۔ جڈاں آبادی 8 تئیں پہنچ ویندی اے تاں اسلحہ خانے کوں میگزین وچ اپگریڈ کیتا ون٘جھ سڳدا اے۔
model.building.arsenal.name=آرسنل
model.building.arsenal.description=آرسنل اوزاراں توں بندوقاں بݨاوݨ کیتے ورتیا ویندا اے۔ آرسنل بݨاوݨ دے بعد بندوقاں کوں پیدا کرݨ کیتے صرف آدھے اوزار درکار ہوندن۔
model.building.blacksmithHouse.name=لوہار دا گھر
model.building.blacksmithHouse.description=لوہار دا گھر، جیکوں لوہار دی دکان وچ اپگریڈ کیتا ون٘جھ سڳدا اے، دھات کوں اوزاراں وچ تبدیل کرݨ کیتے ورتیا ویندا اے۔
model.building.blacksmithShop.name=لوہار دی دکان
model.building.blacksmithShop.description=لوہار دی دکان، جیکوں آئرن ورکس وچ اپگریڈ کیتا ون٘جھ سڳدا اے، دھات کوں اوزاراں وچ تبدیل کرݨ کیتے ورتی ویندی اے۔ کجھ قسماں دیاں عمارتاں بݨاوݨ تے ساریاں قسماں دیاں عمارتاں کوں اپگریڈ کرݨ کیتے اوزار درکار ہوندن۔ پائنیر وی اوزار ورتیندن تے بندوقاں بݨاوݨ کیتے وی۔ جڈاں کالونی دی آبادی 8 تئیں پہنچ ون٘جھے تاں لوہار دی دکان کوں آئرن ورکس نال بدل ݙتا ون٘جھ سڳدا اے، بشرطیکہ ایڈم سمتھ کانٹی نینٹل کانگریس وچ شامل تھیا ہووے۔ لوہار دی دکان اوزاراں دی پیداوار ودھیندی اے۔
model.building.carpenterHouse.name=بڑھئی دا گھر
model.building.carpenterHouse.description=بڑھئی دا گھر، جیکوں جڈاں کالونی دی آبادی 3 تئیں پہنچ ون٘جھے تاں لمبر مل وچ اپگریڈ کیتا ون٘جھ سڳدا اے، لکڑ کوں ہتھوڑیاں وچ تبدیل کرݨ کیتے ورتیا ویندا اے۔ ساریاں قسماں دیاں عمارتاں بݨاوݨ کیتے ہتھوڑے درکار ہوندن۔
model.building.cathedral.name=کیتھیڈرل
model.building.cathedral.description=جیہڑی کالونی دی آبادی 3 یا ودھ ہووے اوہ چرچ بݨا سڳدی اے، جیکوں جڈاں آبادی 8 تئیں پہنچ ون٘جھے تاں کیتھیڈرل وچ اپگریڈ کیتا ون٘جھ سڳدا اے۔
model.building.chapel.name=چیپل
model.building.chapel.description=چیپل تہاݙے نوآبادیاں کیتے اپݨا مذہب مناوݨ دی جاہ اے۔ چیپل تھوڑیاں گھنٹیاں پیدا کریندا اے۔
model.building.church.name=گرجاگھر
model.building.church.description=جیہڑی کالونی دی آبادی 3 یا ودھ ہووے اوہ چرچ بݨا سڳدی اے، جیکوں جڈاں آبادی 8 تئیں پہنچ ون٘جھے تاں کیتھیڈرل وچ اپگریڈ کیتا ون٘جھ سڳدا اے۔
model.building.cigarFactory.name=سگر فیکٹری
model.building.cigarFactory.description=سگر فیکٹری، جیکوں اپگریڈ نہیں کیتا ون٘جھ سڳدا، تمباکو توں سگر بݨاوݨ کیتے ورتی ویندی اے۔ سگر فیکٹری سگراں دی پیداوار ودھیندی اے۔
model.building.college.name=کالج
model.building.college.description=جیہڑی کالونی دی آبادی گھٹ توں گھٹ 4 ہووے اوہ اسکول ہاؤس بݨا سڳدی اے، جیہڑا کجھ ماہر کاریگراں کوں ہک غیر ہنر مند نوآبادی کوں اپݨا ہنر سکھاوݨ دے قابل بݨیندا اے۔ جڈاں آبادی 8 تئیں پہنچ ون٘جھے تاں ایں کوں کالج وچ اپگریڈ کیتا ون٘جھ سڳدا اے، جتھے ݙو نوآبادی ودھیک ہنر سکھا سڳدن۔ جڈاں آبادی 10 تئیں پہنچ ون٘جھے تاں کالج کوں یونیورسٹی نال بدل ݙتا ون٘جھ سڳدا اے، جتھے ترے نوآبادی سارے ہنر سکھا سڳدن۔
model.building.country.name=چاراگاہ
model.building.country.description=چاراگاہ تہاݙی کالونی دے کول ہک جاہ اے، جتھے تہاݙے گھوڑے آزاد پھردن۔ اصطبل بݨاوݨ نال گھوڑیاں دی ودھ توں ودھ پیداوار ودھ ویسی۔
model.building.customHouse.name=کسٹم ہاؤس
model.building.customHouse.description=کسٹم ہاؤس، جیہڑا جڈاں پیٹر سٹویوسینٹ کانٹی نینٹل کانگریس وچ شامل تھی ون٘جھے تاں بݨایا ون٘جھ سڳدا اے، تہاکوں مال سیدھا یورپ کوں ویچݨ دی اجازت ݙیندا اے۔
model.building.depot.name=ڈِپُو
model.building.depot.description=ڈپو ہر قسم دا مال ذخیرہ کریندا اے۔ ایندی شروعاتی گنجائش ہر قسم دے مال دی 100 یونٹ اے، پر ایں کوں گودام وچ اپگریڈ کیتا ون٘جھ سڳدا اے، جیہڑا 200 رکھ سڳدا اے۔ ہور گودام دی توسیع بݨاوݨ نال ذخیرہ کرݨ دیاں گنجائشاں 300 تئیں ودھ ویندن۔
model.building.distillerHouse.name=ڈسٹلر دا گھر
model.building.distillerHouse.description=ڈسٹلر دا گھر، جیکوں رم ڈسٹلری وچ اپگریڈ کیتا ون٘جھ سڳدا اے، چینی توں رم بݨاوݨ کیتے ورتیا ویندا اے۔
model.building.docks.name=گودی
model.building.docks.description=گودی نوآبادیاں کوں کالونی دے نال آلے سمندری ٹائلاں تے مچھی پیدا کرݨ دی اجازت ݙیندی اے۔ جڈاں آبادی 3 تئیں پہنچ ون٘جھے تاں گودی کوں ڈرائی ڈاک وچ اپگریڈ کیتا ون٘جھ سڳدا اے۔
model.building.drydock.name=ڈرائی ڈاک
model.building.drydock.description=ڈرائی ڈاک نوآبادیاں کوں کالونی دے نال آلے سمندری ٹائلاں تے مچھی پیدا کرݨ دی اجازت ݙیندی اے، تے ایہ جہازاں دی مرمت دی اجازت ݙیندی اے۔
model.building.fort.name=قلعہ
model.building.fort.description=قلعہ، جیہڑا صرف سٹاکیڈ بݨاوݨ دے بعد بݨایا ون٘جھ سڳدا اے، نوآبادیاں کوں حملیاں توں بچاوݨا اے۔
model.building.fortress.name=فورٹریس
model.building.fortress.description=فورٹریس، جیہڑا قلعہ بݨاوݨ دے بعد تے جڈاں آبادی 8 تئیں پہنچ ون٘جھے تاں بݨایا ون٘جھ سڳدا اے، نوآبادیاں کوں حملیاں توں بچاوݨا اے۔
model.building.furFactory.name=فر فیکٹری
model.building.furFactory.description=فر فیکٹری، جیکوں اپگریڈ نہیں کیتا ون٘جھ سڳدا، فر توں کوٹ بݨاوݨ کیتے ورتی ویندی اے۔ فر فیکٹری کوٹاں دی پیداوار ودھیندی اے۔
