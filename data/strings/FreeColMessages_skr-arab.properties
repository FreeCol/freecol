model.building.furTraderHouse.description=فر تاجر دا گھر، جیکوں فر تجارتی چوکی وچ اپگریڈ کیتا ون٘جھ سڳدا اے، فر توں کوٹ بݨاوݨ کیتے ورتیا ویندا اے۔ جڈاں کالونی دی آبادی 3 تئیں پہنچ ون٘جھے تاں فر تاجر دے گھر کوں فر تجارتی چوکی نال بدل ݙتا ون٘جھ سڳدا اے۔
