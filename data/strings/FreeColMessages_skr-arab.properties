model.resource.fish.name=مچھی
model.resource.fish.description=چھوٹی مچھیاں دی وݙی مقدار ایں تھاں تے وݙیاں مچھیاں کوں راغب کریندی اے، جیہڑیاں ٻدھے وچ پرجوش مچھیریاں کوں راغب کریندیاں ہن۔
model.resource.furs.name=فر
model.resource.furs.description=انہاں جنگلاں وچ جانوراں دی فراوانی ٻہوں سارے شکاریاں کوں سہل شکار دی تلاش وچ گھن آندی اے۔
model.resource.game.name=کھیڈ
model.resource.game.description=ایہ جنگل ٻہوں سارے جانوراں دا گھر اے، جیہڑا فر یا خوراک کیتے شکار کیتے موزوں اے۔
