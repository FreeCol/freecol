model.tile.arctic.name=قطب شمالی
model.tile.arctic.description=آرکٹک زیادہتر برف نال ڈھکیا ہویا ہک وسیع سمندر اے جیکوں درختیں توں خالی جمی ہوئی زمین گھیرے ہوئے اے تے ایہ کجھ وی پیدا نی کریندا۔ ایہ شمالی تے جنوبی قطب دے نیڑے مِلدے ہن تے عام طور تے کالونیاں دی مدد نی کر سڳدے۔
model.tile.borealForest.name=بوریئل جنگل
model.tile.borealForest.description=بوریئل جنگل غلہ، لکڑ، فر تے کجھ دھات پیدا کریندے ہن۔ ایہ قطبی علاقیاں دے نیڑے مِلدے ہن تے انہاں کوں صاف کر تے ٹنڈرا بنایا ون٘جھ سڳدا اے۔
model.tile.broadleafForest.name=براڈلیف جنگل
model.tile.broadleafForest.description=براڈلیف جنگل غلہ، لکڑ، فر تے کجھ کپاہ پیدا کریندے ہن۔ ایہ معتدل عرض بلد وچ مِلدے ہن تے صاف کرݨ تے گھاہ دے میداناں وچ بدل ون٘جدے ہن۔
model.tile.coniferForest.name=کونیفر جنگل
model.tile.coniferForest.description=کونیفر جنگل غلہ، لکڑ، فر تے کجھ تمباکو پیدا کریندے ہن۔ ایہ زیادہ تر خط استوا دے نیڑے مِلدے ہن تے صاف کرݨ تے گھاہ والے میدان وچ بدل ون٘جدے ہن۔
model.tile.desert.name=صحرا
model.tile.desert.description=ریگستان ٻہوں خشک ہوندے ہن، انہاں کوں ٻہوں تھوڑی بارش مِلدی اے۔ تھوڑے ہووݨ دے باوجود، ریگستان غلہ، کپاہ تے دھات پیدا کریندے ہن۔
model.tile.grassland.name=گھاہ آلا میدان
model.tile.grassland.description=گھاہ آلے میدان گھاہ دے کھلے، لڳاتار ہموار علاقے ہوندے ہن۔ ایہ اکثر اچیاں جاہیں تے معتدل جنگلاں دے نیڑے یا نیم گرم علاقیاں وچ ریگستاناں دے نیڑے ہوندے ہن۔ گھاہ آلے میدان تمباکو اگاوݨ کیتے بہترین ہن۔ خوراک وی اگائی ون٘جھ سڳدی اے۔
model.tile.greatRiver.name=وݙا دریا
model.tile.greatRiver.description=وݙے دریا ایجھے دریا ہوندے ہن جنہاں وچ جہاز چل سڳدے ہن۔
model.tile.highSeas.name=کھلا سمندر
model.tile.highSeas.description=کھلے سمندر مچھی پیدا کریندے ہن۔ ایہ تہاݙے جہازاں کوں یورپ توں تے یورپ تئیں جہاز چلاوݨ دی سہولت وی ݙیندے ہن۔
model.tile.hills.name=پہاڑیاں
model.tile.hills.description=ٹلر آس پاس دی زمین توں ہک محدود علاقے وچ اُچے تھیندے ہن۔ ٹلر وݙی مقدار وچ دھات پیدا کریندے ہن، نال ای کجھ غلہ وی۔
model.tile.lake.name=جھیل
model.tile.lake.description=جھیلاں زمین دے وچکار پاݨی دے ذخیرے ہوندے ہن۔ جھیلاں دے نیڑے بݨائیاں ڳیاں کالونیاں جھیل دے قدرتی وسائل توں فائدہ چݨدی ہن، پر جہازاں راہیں اوہاں تئیں پہنچݨ ممکن نہ ہووے۔
model.tile.marsh.name=مارش
model.tile.marsh.description=مارش پاݨی آلی زمین دی ہک قسم اے، جیندے وچ گھاہ، سر کنݙیاں، نرسل، ٹائیفا، سیجز تے ٻئے جڑی بوٹیاں اتھلے پاݨی وچ ہوندیاں ہن۔ مارش کجھ غلہ تے تمباکو پیدا کریندا اے، نال ای دھات وی۔ مارش زیادہ تر قطبی علاقیاں دے نیڑے مِلدے ہن۔
model.tile.mixedForest.name=رلا ملا جنگل
model.tile.mixedForest.description=رلے ملے جنگل، جیہڑے معتدل عرض بلد وچ مِلدے ہن، غلہ، لکڑ، فر تے کجھ کپاہ پیدا کریندے ہن۔ جے رلے ملے جنگل صاف کیتے ون٘جن تاں اوہ میدان بݨ ویندے ہن۔
model.tile.mountains.name=پہاڑ
model.tile.mountains.description=پہاڑ ہک محدود علاقے وچ آس پاس دی زمین توں اُچے تھیندے ہن۔ پہاڑ عام طور تے ٹلراں توں ودھ کھڑے ہوندے ہن۔ اتھاں سفر کرݨا مشکل اے تے کالونیاں نی بݨائیاں ون٘ج سڳدیاں۔ اوہ ہک وݙا دفاعی بونس ݙیندے ہن پر قلعہ بندی ایہنوں ودھا نی سڳدی۔ دھات تے چاندی کڈھݨ کیتے کان کنی فائدہ مند ثابت تھیندی اے۔
model.tile.ocean.name=سمندر
model.tile.ocean.description=سمندر کھارے پاݨی دے وݙے ذخیرے ہن، مچھی پکڑݨ کیتے چنڳے۔ زمین دی موجودگی نال تے خاص طور تے دریاواں دے دہانے نال مچھی دی مقدار ودھ ویندی اے۔
model.tile.plains.name=میدان
model.tile.plains.description=میدان زمین دے وݙے علاقے ہن جنہاں دی سطح نسبتاً ہموار اے، کاشتکاری کیتے ودھ مناسب۔ اوہ وݙی مقدار وچ غلہ، گھٹ مقدار وچ کپاہ تے کجھ دھات پیدا کریندے ہن۔ اوہ معتدل علاقیاں وچ مِلدے ہن۔
model.tile.prairie.name=پریری
model.tile.prairie.description=پریری زمین دا ہک علاقہ اے جیہڑا گھاہ تے جڑی بوٹیاں کوں سہارا ݙیندا اے، گھٹ وَݨاں نال، تے عام طور تے معتدل موسم آلا۔ پریری غلہ تے کپاہ دی کاشت کیتے سب توں ودھ مناسب ہن۔
model.tile.rainForest.name=برساتی جنگل
model.tile.rainForest.description=برساتی جنگل غلہ، لکڑ، فر، تے کجھ دھات تے چینی پیدا کریندے ہن۔ اوہ حارہ خطے وچ مِلدے ہن تے صاف کرݨ نال دلدل بݨدی اے۔
model.tile.savannah.name=سوانا
model.tile.savannah.description=سوانا وچ گھاہ تے وَݨ ٻئے نال غالب نباتات دیاں قسماں ہن۔ سوانا عام طور تے جنگل یا جنگلاتی علاقیاں تے گھاہ دے میدان یا صحرائی علاقیاں دے درمیان ہک عبوری علاقے دے طور تے ݙٹھے ویندے ہن۔ سوانا بنیادی طور تے غلہ تے چینی پیدا کریندا اے۔
model.tile.scrubForest.name=جھاڑی جنگل
model.tile.scrubForest.description=جھاڑی جنگل غلہ، لکڑ، فر، تے کجھ کپاہ تے دھات پیدا کریندے ہن۔ جے انہاں کوں صاف کیتا ون٘جھے تاں زمین صحرا بݨ ویندی اے۔ جھاڑی جنگل معتدل علاقیاں وچ مِلدے ہن۔
model.tile.swamp.name=دلدل
model.tile.swamp.description=اتھلے پاݨی دے ذخیریاں نال حارہ آبی زمین۔ دلدل وچ کھلے پاݨی دی سطح دا تناسب ودھ ہوندا اے تے عام طور تے دلدلیاں توں ڈونگھی ہوندی اے۔ دلدل کجھ غلہ، تے تھوڑی مقدار وچ چینی تے دھات ݙیندی اے۔
model.tile.tropicalForest.name=حارہ جنگل
model.tile.tropicalForest.description=حارہ جنگل غلہ، لکڑ، فر، تے کجھ چینی پیدا کریندے ہن۔ حارہ جنگلاں کوں صاف کرݨ نال سوانا بݨدا اے۔
model.tile.tundra.name=ٹنڈرا
model.tile.tundra.description=ٹنڈرا ہک ایجھاں علاقہ اے جتھاں ون٘ݨاں دی نشوونما گھٹ درجہ حرارت تے مختصر نشوونما دے موسماں دی وجہ توں متاثر ہوندی اے۔ ٹنڈرا غلہ تے کجھ دھات پیدا کریندا اے۔ ایہ قطبی علاقیاں دے نیڑے مِلدا اے۔
model.tile.wetlandForest.name=دلدلی جنگل
model.tile.wetlandForest.description=دلدلی جنگل غلہ، لکڑ، فر، تے کجھ دھات پیدا کریندے ہن۔ دلدلی جنگلاں کوں صاف کر کے دلدلی زمین بݨائی ون٘جھ سڳدی اے۔ اوہ قطبی علاقیاں دے نیڑے مِلدے ہن۔
colonist.name=تجریدی نوآبادکار
colonist.description=بنیادی نوآبادکار یونٹ
