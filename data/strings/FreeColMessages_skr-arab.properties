model.building.ironWorks.description=آئرن ورکس، جیکوں اپگریڈ نہیں کیتا ون٘جھ سڳدا، دھات کوں اوزاراں وچ تبدیل کرݨ کیتے ورتیا ویندا اے۔ کجھ قسماں دیاں عمارتاں بݨاوݨ تے ساریاں قسماں دیاں عمارتاں کوں اپگریڈ کرݨ کیتے اوزار درکار ہوندن۔ پائنیر وی اوزار ورتیندن تے بندوقاں بݨاوݨ کیتے وی۔ آئرن ورکس اوزاراں دی پیداوار ودھیندا اے۔
model.building.lumberMill.name=لمبر مل
model.building.lumberMill.description=لمبر مل، جیکوں اپگریڈ نہیں کیتا ون٘جھ سڳدا، لکڑ کوں ہتھوڑیاں وچ تبدیل کرݨ کیتے ورتیا ویندا اے۔ ساریاں قسماں دیاں عمارتاں بݨاوݨ کیتے ہتھوڑے درکار ہوندن۔ لمبر مل ہتھوڑیاں دی پیداوار ودھیندا اے۔
model.building.magazine.name=میگزین
model.building.magazine.description=میگزین اوزاراں توں بندوقاں بݨاوݨ کیتے ورتیا ویندا اے۔ میگزین کوں آرسنل وچ اپگریڈ کیتا ون٘جھ سڳدا اے، بشرطیکہ ہرنانڈو ڈی سوٹو کانٹی نینٹل کانگریس وچ شامل تھیا ہووے۔ میگزین بندوقاں دی پیداوار ودھیندا اے۔
