model.foundingFather.adamSmith.description=فیکٹریاں دی تعمیر ممکن تھیندی اے۔
model.foundingFather.adamSmith.text=جدید معاشیات دے بانی دے طور تے مشہور، سمتھ نے معاشی نظریے تے کئی تحریراں لکھیاں، جنہاں وچ ویلتھ آف نیشنز اوہدی سب توں مشہور تحریر اے۔
model.foundingFather.jacobFugger.description=موجودہ وقت وچ نافذ سارے بائیکاٹ ختم کر ݙتے ویندے ہن۔
model.foundingFather.jacobFugger.text=انتہائی دولت مند جرمن سوداگر تے بینکر۔ خاندانی شراکتاں تے کان کنی دی صنعتاں وچ اسٹاک ہولڈنگز نال وݙی دولت جمع کیتی۔
model.foundingFather.peterMinuit.description=انڈین ہݨ اپݨی زمین دا معاوضہ نہیں منڳدے۔
model.foundingFather.peterMinuit.text=جیہڑی جاہ بعد وچ مین ہیٹن آئی لینڈ دے ناں نال مشہور تھئی، اوہنوں مقامی امریکیاں کولوں تقریباً 60 ڈچ گلڈرز وچ خریدیا۔ بعد وچ اوہنے ڈیلاویئر بے دے علاقے کوں وی آباد کیتا۔
model.foundingFather.peterStuyvesant.description=کسٹم ہاؤس دی تعمیر ممکن تھیندی اے۔
model.foundingFather.peterStuyvesant.text=نیو نیدرلینڈز دا گورنر جنرل مقرر کیتا ڳیا، جیہڑا برطانوی حملے کوں نہ روک سڳیا، جیندے بعد ایہ نیو یارک بݨ ڳیا۔
model.foundingFather.janDeWitt.description=غیر ملکی کالونیاں نال تجارت ممکن تھیندی اے تے نوآبادیاتی حریفاں بارے ٻئی معلومات ݙکھائی ویندی اے۔
model.foundingFather.janDeWitt.text=ڈی وٹ ہک عظیم ڈچ سیاستدان ہا۔ اوہ سوداگراں دی نمائندگی کریندا ہا تے صنعت تے تجارت دی حوصلہ افزائی کریندا ہا۔ اوہنے انگلینڈ نال جنگاں ختم کرݨ کیتے ڈچاں کیتے کئی اہم معاہدے وی کیتے۔
model.foundingFather.ferdinandMagellan.description=بحری جہازاں دی حرکت 1 نال ودھائی ویندی اے تے یورپ/امریکہ تئیں سفر دا وقت گھٹ کر ݙتا ویندا اے۔
model.foundingFather.ferdinandMagellan.text=زمین تے سفر کرݨ آلا عظیم ترین مہم جویاں وچوں ہک۔ میگلان پہلا بندہ ہا جنہیں زمین دے گرد چکر لایا تے بحر الکاہل پار کیتا۔
model.foundingFather.franciscoDeCoronado.description=نقشے تے ساریاں موجود کالونیاں نظر آݨ لڳدیاں ہن۔
model.foundingFather.franciscoDeCoronado.text=گرینڈ کینین کوں ݙیکھݨ آلا پہلا یورپی مہم جو۔ بھانویں اوہ سونے دے اوہ شہر کݙاں نی لبھ سڳیا جنہاں دی اوہنوں تلاش ہئی، لیکن اوہنوں اوں علاقے دا نقشہ بݨایا جیکوں ہݨ جنوب مغربی امریکہ آکھیا ویندا اے، اوہ مزید مہم جوئی کیتے اہم ہا۔
model.foundingFather.hernandoDeSoto.description=گم تھیے شہراں دیاں افواہواں دی تحقیق کݙاں منفی نتیجہ نی ݙیندی تے سارے زمینی یونٹاں دی نظر دا رداس ودھیا ہویا ہوندا اے۔
model.foundingFather.hernandoDeSoto.text=فلوریڈا تے جنوب مشرقی امریکہ دی مہم جوئی کرݨ آلا پہلا یورپی۔ اوہنے وسطی امریکہ دیاں فتحاں وچ وی نمایاں کردار ادا کیتا۔
model.foundingFather.henryHudson.description=سارے فر ٹریپرز دی پیداوار 100% ودھائی ویندی اے۔
model.foundingFather.henryHudson.text=انگریز بحری مہم جو جنہیں شمال مشرقی شمالی امریکی براعظم دے وݙے علاقے دی مہم جوئی تے نقشہ سازی کیتی۔ اوں علاقے دے کئی آبی راستے اوہدی عزت وچ اوہدے ناں تے ہن۔ اوہدا اصل مقصد مشہور شمال مغربی راستے دی تلاش ہا۔
model.foundingFather.laSalle.description=جڈاں آبادی 3 تئیں پہنچ ون٘جھے تاں ساریاں موجود تے آݨ والیاں کالونیاں کوں سٹاکیڈ ݙتا ویندا اے۔
model.foundingFather.laSalle.text=مسیسیپی دریا دی پوری لمبائی دا سفر کرݨ آلا پہلا یورپی، ڈی لا سال اوندے کنارے تے کئی تجارتی چوکیاں قائم کرݨ دے مشن تے ہا۔ بعد وچ اوہنے فرانسیسی بادشاہ دے اعزاز وچ پورے طاس کوں لوزیانا دے طور تے دعویٰ کیتا۔ بعد وچ اوہنے عظیم جھیلاں وچوں کئی دی مہم جوئی کیتی۔
model.foundingFather.hernanCortes.description=فتح کیتے ڳئے مقامی بستیاں ہر حال وچ خزانہ ݙیندیاں ہن (تے ودھ مقدار وچ) تے بادشاہ دے بحری جہاز اوہنوں مفت نقل کریندے ہن۔
model.foundingFather.hernanCortes.text=مشہور ہسپانوی فاتح جنہیں ازٹیک سلطنت کوں ختم کر ݙتا تے میکسیکو تے اسپین دا دعویٰ کیتا۔
model.foundingFather.georgeWashington.description=جیہڑا سپاہی یا ڈریگون لڑائی جتݨدا اے اوہ خودکار طور تے اڳلے ممکنہ درجے تے ترقی ݙتا ویندا اے۔
model.foundingFather.georgeWashington.text=جنرل واشنگٹن نوآبادیاتی فوج دی قیادت کریندے ہوئے انگریزاں تے فتح حاصل کیتی تے کالونیاں کیتے آزادی حاصل کیتی۔ ایں فتح تے اوندی قیادت دی وجہ توں اوہنوں نویں قوم دا پہلا صدر نامزد کیتا ڳیا۔
model.foundingFather.paulRevere.description=جڈاں اینجھی کالونی تے حملہ تھیندا اے جنہاں وچ کوئی مستقل سپاہی کائنی، تاں ہک کالونسٹ خودکار طور تے ذخیرہ کیتے ڳئے بندوقاں چک ݙیندا اے تے دفاع کریندا اے۔
model.foundingFather.paulRevere.text=نوآبادیاتی امریکہ دا مشہور سوار اپݨے گھوڑے تے سوار تھی کر دہیاں وچ دڑاکے مار کے کالونسٹاں کوں خبر ݙیندا ہا کہ انگریز سپاہی آ راہے ہن۔ سواری دے دوران اونہوں پکڑ ڳھدا ڳیا تے بعد وچ چھوڑ ݙتا ڳیا جڈاں اوندے پکڑݨ آلیاں کوں یقین تھیا کہ اوہ سخت خطرے وچ ہن تے اوندا قیدی اونہاں کوں سست کر سڳدا اے۔
model.foundingFather.francisDrake.description=سارے پرائیویٹرز دی جنگی طاقت 50% ودھائی ویندی اے۔
model.foundingFather.francisDrake.text=ہک عظیم انگریز بحری کپتان، ڈریک پہلا انگریز ہا جنہیں زمین دے گرد چکر لایا تے ہسپانوی بحری ٻیڑے دے خلاف لڑائیاں وچ ہک ہیرو ہا۔
model.foundingFather.johnPaulJones.description=تہاݙی نوآبادیاتی بحریہ وچ ہک فریگیٹ (مفت) شامل کیتی ویندی اے۔
model.foundingFather.johnPaulJones.text=امریکہ وچ ہک عظیم بحری کپتان دے طور تے سراہے ڳئے، جونز سمندر وچ انگریزاں نال لڑدے ہوئے مشہور الفاظ آکھے 'جناب، میں اجے لڑݨ شروع نی کیتا'۔ بعد وچ اونہیں اپݨے جہاز کوں انگریزی جہاز دے ڈیک توں سمندر دے تلوں ون٘جھدے ݙٹھا۔
model.foundingFather.thomasJefferson.description=کالونیاں وچ لبرٹی بیل دی پیداوار 50% ودھائی ویندی اے۔
model.foundingFather.thomasJefferson.text=محب وطن دی طاقتور آواز، جیفرسن کوں اعلامیہ آزادی لکھݨ دا کریڈٹ ݙتا ویندا اے۔ بعد وچ اوہ امریکہ دا تیجا صدر بݨیا۔
model.foundingFather.pocahontas.description=تہاݙے تے مقامی لوکاں دے درمیان سارے تناؤ ختم کر ݙتے ویندے ہن تے انڈین الرٹ ادھی رفتار نال پیدا تھیندا اے۔
model.foundingFather.pocahontas.text=ابتدائی جیمز ٹاؤن آباد کاراں تے مقامی امریکیاں دے درمیان ہک امن قائم کرݨ آلی۔ اونہوں کریڈٹ ݙتا ویندا اے کہ اونہیں سخت دور وچ اوتھے دے بھکے کالونسٹاں کوں خوراک تے ٻیا سامان پیجا۔ بعد وچ اوہ عیسائیت قبول کر ڳئی تے ہک انگریز نال شادی کیتی۔
model.foundingFather.thomasPaine.description=کالونیاں وچ لبرٹی بیل دی پیداوار موجودہ ٹیکس دی شرح دے برابر ودھائی ویندی اے۔
model.foundingFather.thomasPaine.text=بینجمن فرینکلن دی ترغیب تے اپݨے قلم نال کالونسٹاں کوں متاثر کیتا۔ ہک پمفلٹ، کامن سینس، شائع کیتا جیہڑا کالونیاں وچ سارے محب وطن لوکاں دے خیالات دی رہنمائی کریندا ہا۔
model.foundingFather.simonBolivar.description=ساریاں موجود کالونیاں وچ سنز آف لبرٹی دی رکنیت 20% ودھائی ویندی اے۔
model.foundingFather.simonBolivar.text=اسپین توں جنوبی امریکہ دی آزادی دی جدوجہد وچ ہک عظیم رہنما دے طور تے یاد کیتا ویندا اے۔ بولیور اوں علاقے کوں آزاد کیتا جیہڑا ہݨ وینزویلا اے تے بعد وچ اوندا پہلا صدر بݨیا۔
model.foundingFather.benjaminFranklin.description=تاج دیاں غیر ملکی جنگاں دا نویں دنیا وچ تعلقات تے کوئی اثر نی ہوندا تے نویں دنیا دے یورپین مذاکرات وچ ہمیشہ امن دی پیشکش کریندے ہن۔
model.foundingFather.benjaminFranklin.text=اعلامیہ آزادی وچ بھاری حصہ ݙالݨ آلا، فرینکلن انقلاب دیاں آوازاں وچوں ہک ہا۔ اونہیں یورپ تے کالونیاں دے درمیان ودھ سفر کیتا تے جنگ وچ فرانسیسیاں دی حمایت حاصل کیتی۔
model.foundingFather.williamBrewster.description=گودی تے ہݨ کوئی مجرم یا نوکر نظر نی آندے، تے تساں منتخب کر سڳدے ہو کہ بھرتی دے پول وچوں کیہڑا مہاجر گودی تے ون٘جھے۔
model.foundingFather.williamBrewster.text=بریوسٹر نیو انگلینڈ وچ پلائی ماؤتھ کالونی دا پیوریٹن رہنما ہا۔
model.foundingFather.williamPenn.description=ساریاں کالونیاں وچ کراس دی پیداوار 50% ودھائی ویندی اے۔
model.foundingFather.williamPenn.text=یارک دے ڈیوک دے ہک قریبی دوست دے طور تے، پین کوں اوہ زمین ݙتی ڳئی جیہڑی زیادہ تر پنسلوانیا، ڈیلاوئیر تے نیو جرسی اے۔ اونہیں کئی سال تئیں کوئیکر کالونی تے حکومت کیتی تاکہ ٻئے کوئیکرز کیتے ہک پناہ گاہ فراہم کرے۔
model.foundingFather.fatherJeanDeBrebeuf.description=سارے مبلغ ماہر دے طور تے کم کریندے ہن۔
model.foundingFather.fatherJeanDeBrebeuf.text=ہیورن انڈینز نال دوستی کیتی تے ٻہوں سارے کوں عیسائیت وچ تبدیل کیتا۔ ایروکوئی دے ہتھوں ماریا ڳیا جنہیں آخرکار اپݨے دشمن، ہیورنز کوں شکست ݙتی۔
model.foundingFather.juanDeSepulveda.description=این امکان ودھایا ویندا اے کہ ہک مغلوب انڈین بستی دی آبادی 20% نال "مذہب تبدیل" کر کے تہاݙیاں کالونیاں وچ شامل تھی ون٘جھے۔
model.foundingFather.juanDeSepulveda.text=ہک ہسپانوی عالم دین جنہیں انڈین زمیناں دی فتح تے مقامی لوکاں دے زبردستی تبلیغ دی وکالت کیتی۔
model.foundingFather.bartolomeDeLasCasas.description=سارے موجود انڈین مذہب تبدیل کرݨ آلے آزاد کالونسٹ بݨائے ویندے ہن۔
model.foundingFather.bartolomeDeLasCasas.text=ہک کیتھولک پادری جنہیں انڈیز وچ سفر کر کے انڈینز کوں مذہب تبدیل کیتا تے مقامی لوکاں نال سلوک تے اسپین دی ملامت کیتی۔
