model.building.newspaper.description=اخبار، جیہڑا صرف پرنٹنگ پریس بݨاوݨ دے بعد تے جڈاں آبادی 4 تئیں پہنچ ون٘جھے تاں بݨایا ون٘جھ سڳدا اے، گھنٹیاں دی پیداوار ودھیندا اے۔
model.building.printingPress.name=چھاپہ خانہ
model.building.printingPress.description=پرنٹنگ پریس، جیکوں جڈاں آبادی 4 تئیں پہنچ ون٘جھے تاں اخبار وچ اپگریڈ کیتا ون٘جھ سڳدا اے، گھنٹیاں دی پیداوار ودھیندا اے۔
model.building.rumDistillery.name=رم ڈسٹلری
model.building.rumDistillery.description=رم ڈسٹلری، جیکوں رم فیکٹری وچ اپگریڈ کیتا ون٘جھ سڳدا اے، چینی توں رم بݨاوݨ کیتے ورتی ویندی اے۔ جڈاں ایڈم سمتھ کانٹی نینٹل کانگریس وچ شامل تھی ون٘جھے تے کالونی دی آبادی گھٹ توں گھٹ 8 ہووے تاں رم ڈسٹلری کوں رم فیکٹری نال بدل ݙتا ون٘جھ سڳدا اے۔ رم ڈسٹلری رم دی پیداوار ودھیندی اے۔
