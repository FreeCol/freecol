model.building.furTradingPost.description=فر تاجر دی چوکی، جیکوں فر فیکٹری وچ اپگریڈ کیتا ون٘جھ سڳدا اے، فر توں کوٹ بݨاوݨ کیتے ورتی ویندی اے۔ جڈاں کالونی دی آبادی 8 تئیں پہنچ ون٘جھے تاں فر تاجر دی چوکی کوں فر فیکٹری نال بدل ݙتا ون٘جھ سڳدا اے۔
