model.building.shipyard.name=شپ یارڈ
model.building.shipyard.description=شپ یارڈ نوآبادیاں کوں کالونی دے نال آلے سمندری ٹائلاں تے مچھی پیدا کرݨ دی اجازت ݙیندا اے، ایہ جہازاں دی مرمت دی اجازت ݙیندا اے، تے جہاز بݨاوݨ دی اجازت ݙیندا اے۔
