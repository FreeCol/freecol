declareIndependence.resolution=اج کانگریس نے سب توں اہم قرارداد پاس کر ڳھدی اے، جیہڑی کݙاہیں امریکہ وچ منظور کیتی ڳئی اے۔\n\nمیں چنگی طرح واقف ہاں جو ایں اعلان کوں قائم رکھݨ تے انہاں ریاستاں دی حمایت تے دفاع کرݨ وچ ساکوں محنت، خون تے مال دی کتنی قیمت ادا کرݨی پوسی۔ پھر وی سارے اندھارے وچوں میں موہݨے نور تے جلال دیاں کرݨاں ویکھ سڳدا ہاں۔ میں ویکھ سڳدا ہاں جو انجام ہر طرح دے ذرائع توں کیتے ودھ قیمتی اے۔ تے جو آوݨ آلی نسل اوس ݙیہاڑ دے فیصلے تے فخر کریسی، بھاویں اساں اونڈے تے پچھتاوے وی، جیہڑا میں خدا تے بھروسہ کر کے آکھدا ہاں جو اساں نئیں پچھتایسوں۔\n\nشاہی مہم جوئی فوج جلد ساݙے سر تے آسی۔ جڈاں اساں نویں کانٹی نینٹل فوج کیتے رضاکار بھرتی کریندے ہِیسے، تڈاں ساݙیاں دفاعی تیاریاں احتیاط نال کرݨیاں چاہیدن۔
