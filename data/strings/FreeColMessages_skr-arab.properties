model.building.tobacconistShop.description=تمباکو فروش دی دکان، جیکوں سگر فیکٹری وچ اپگریڈ کیتا ون٘جھ سڳدا اے، تمباکو توں سگر بݨاوݨ کیتے ورتی ویندی اے۔ جڈاں کالونی دی آبادی 8 تئیں پہنچ ون٘جھے تاں ایں کوں ہور سگر فیکٹری وچ اپگریڈ کیتا ون٘جھ سڳدا اے، بشرطیکہ ایڈم سمتھ کانٹی نینٹل کانگریس وچ شامل تھیا ہووے۔ تمباکو فروش دی دکان سگراں دی پیداوار ودھیندی اے۔
model.building.townHall.name=قصبہ ہال
model.building.townHall.description=ٹاؤن ہال، جیکوں اپگریڈ نہیں کیتا ون٘جھ سڳدا، ترے نوآبادیاں کیتے کم دی جاہواں فراہم کریندا اے جیہڑے آزادی دیاں گھنٹیاں پیدا کریندن۔
model.building.university.name=یونی ورسٹی
model.building.university.description=جیہڑی کالونی دی آبادی گھٹ توں گھٹ 4 ہووے اوہ اسکول ہاؤس بݨا سڳدی اے، جیہڑا کجھ ماہر کاریگراں کوں ہک غیر ہنر مند نوآبادی کوں اپݨا ہنر سکھاوݨ دے قابل بݨیندا اے۔ جڈاں آبادی 8 تئیں پہنچ ون٘جھے تاں ایں کوں کالج وچ اپگریڈ کیتا ون٘جھ سڳدا اے، جتھے ݙو نوآبادی ودھیک ہنر سکھا سڳدن۔ جڈاں آبادی 10 تئیں پہنچ ون٘جھے تاں کالج کوں یونیورسٹی نال بدل ݙتا ون٘جھ سڳدا اے، جتھے ترے نوآبادی سارے ہنر سکھا سڳدن۔
model.building.warehouse.name=ویئر ہاؤس
model.building.warehouse.description=گودام ہر قسم دا مال ذخیرہ کریندا اے۔ ایہ ڈپو دی پہلی اپگریڈ اے، ہر قسم دے مال دی 200 یونٹ دی گنجائش نال۔
model.building.warehouseExpansion.name=گودام دی توسیع
model.building.warehouseExpansion.description=توسیع شدہ گودام ہر قسم دا مال ذخیرہ کریندا اے۔ ایہ سادے گودام دی اپگریڈ اے، ہر قسم دے مال دی 300 یونٹ دی گنجائش نال۔
model.building.weaverHouse.name=جلہے دا گھر
model.building.weaverHouse.description=جلہے دا گھر، جیکوں جلہے دی دکان وچ اپگریڈ کیتا ون٘جھ سڳدا اے، کپاہ کوں کپڑے وچ بدلݨ کیتے ورتیا ویندا اے۔ جڈاں کالونی دی آبادی 3 تئیں پہنچ ون٘جھے تاں ایں کوں اپگریڈ کیتا ون٘جھ سڳدا اے۔
model.building.weaverShop.name=جلہے دی دکان
model.building.weaverShop.description=جلہے دی دکان، جیکوں ٹیکسٹائل مل وچ اپگریڈ کیتا ون٘جھ سڳدا اے، کپاہ کوں کپڑے وچ بدلݨ کیتے ورتی ویندی اے۔ جڈاں کالونی دی آبادی 8 تئیں پہنچ ون٘جھے تاں ایں کوں اپگریڈ کیتا ون٘جھ سڳدا اے۔
